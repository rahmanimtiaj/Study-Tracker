<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Tracker - Modern Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&family=League+Spartan:wght@300;400;700;900&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<style>
:root {
  --bg:#050508; --bg2:#0a0a12; --bg3:#11111f; --panel:#0d0d18;
  --border:#1f1f35; --border-bright:#3a3a5a;
  --green:#00ffa3; --red:#ff2d55; --blue:#00d2ff; --yellow:#ffcc00;
  --text:#f0f0f5; --text2:#a0a0c0; --text3:#505070;
  --flair-green: rgba(0, 255, 163, 0.05);
  --font-main: 'League Spartan', sans-serif;
  --font-mono: 'Share Tech Mono', monospace;
  --font-head: 'Rajdhani', sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}
body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-main);
    min-height: 100vh;
    background-image: 
        radial-gradient(circle at 0% 0%, var(--flair-green) 0%, transparent 40%),
        radial-gradient(circle at 100% 100%, var(--flair-green) 0%, transparent 40%);
}

@keyframes flairPulse {
    0% { box-shadow: 0 0 20px rgba(0, 255, 163, 0.05); }
    50% { box-shadow: 0 0 40px rgba(0, 255, 163, 0.15); }
    100% { box-shadow: 0 0 20px rgba(0, 255, 163, 0.05); }
}

@keyframes blinkRed {
    0%, 100% { opacity: 1; filter: drop-shadow(0 0 5px var(--red)); }
    50% { opacity: 0.2; filter: none; }
}

@keyframes fluidFlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.hdr{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 30px;display:flex;align-items:center;height:65px;position:sticky;top:0;z-index:100}
.fw-logo{width:100px;height:38px;background:var(--red);display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-weight:900;font-size:16px;color:#fff;clip-path:polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%);}
.hdr-title{margin-left:15px; font-size:18px; font-weight:300; text-transform:uppercase; letter-spacing:4px;}

.tabs{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 30px;display:flex;gap:30px;position:sticky;top:65px;z-index:99}
.tab{padding:15px 0;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;}
.tab.active{color:var(--text);border-bottom-color:var(--red);}

.quote-box { background: linear-gradient(rgba(0,0,0,0), var(--bg2)); padding: 40px 20px; text-align: center; border-bottom: 1px solid var(--border); min-height: 150px; }
#quote-text { font-size: 22px; color: var(--text2); max-width: 800px; margin: 0 auto; line-height: 1.6; transition: opacity 0.5s; }
#quote-auth { font-size: 11px; text-transform: uppercase; letter-spacing: 3px; color: var(--red); margin-top: 15px; font-weight: 700; }

.main{padding:30px;max-width:1200px;margin:0 auto}
.section{display:none}.section.active{display:block}

.timer-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.mcard{background:var(--panel);border:1px solid var(--border);padding:25px; transition: 0.4s;}
.active-flair { animation: flairPulse 4s infinite; border-color: rgba(0, 255, 163, 0.3); }

.live-dot { width: 10px; height: 10px; background: var(--red); border-radius: 50%; display: inline-block; animation: blinkRed 1s infinite; margin-right: 8px; }

.timer-disp{font-family:var(--font-mono);font-size:42px;color:var(--green);margin:20px 0;text-align:center;text-shadow: 0 0 15px rgba(0, 255, 163, 0.2);}

.dash-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));gap:20px;margin-bottom:40px}
.stat-card{background:var(--bg2);border:1px solid var(--border);padding:20px;}
.stat-lbl{font-size:10px;text-transform:uppercase;color:var(--text3);margin-bottom:10px;}
.stat-val{font-size:32px;font-weight:700;font-family:var(--font-head);}

/* Intelligence Horizontal Fluid Bars */
.h-bar-container { display: flex; align-items: center; gap: 20px; width: 100%; padding: 10px 0; }
.h-bar-wrap { flex-grow: 1; height: 24px; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; position: relative; }
.h-bar-fill { height: 100%; border-radius: 12px; transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1); background-size: 200% 100%; animation: fluidFlow 3s infinite linear; position: relative; }
.h-bar-fill::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(rgba(255,255,255,0.1), transparent); }

/* Weekly Modern Styling */
.weekly-grid { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
.weekly-grid th { color: var(--text3); font-size: 10px; text-transform: uppercase; letter-spacing: 2px; padding: 15px 10px; text-align: center; }
.weekly-grid td { background: var(--panel); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 18px 10px; text-align: center; font-size: 14px; color: var(--text2); }
.weekly-grid td:first-child { border-left: 1px solid var(--border); border-radius: 8px 0 0 8px; text-align: left; padding-left: 25px; font-weight: 700; }
.weekly-grid td:last-child { border-right: 1px solid var(--border); border-radius: 0 8px 8px 0; }
.weekly-val { display: inline-block; padding: 4px 12px; border-radius: 4px; font-family: var(--font-mono); font-weight: 700; font-size: 13px; }
.weekly-empty { color: var(--text3); opacity: 0.3; font-size: 12px; }

.goal-bar-bg { width: 100%; height: 6px; background: var(--bg); border-radius: 3px; margin-top: 10px; overflow: hidden; border: 1px solid var(--border); }
.goal-bar-fill { height: 100%; background: var(--green); transition: width 1s; box-shadow: 0 0 8px var(--green); }

.btn{padding:12px;border:none;font-weight:700;cursor:pointer;text-transform:uppercase; font-family: var(--font-head); width: 100%;}
.btn-start{background:var(--text);color:var(--bg);}
.btn-stop{background:var(--red);color:#fff;}

textarea{width:100%;background:var(--bg);border:1px solid var(--border);padding:10px;color:var(--text);margin-bottom:10px;resize:none;}

.fw-table{width:100%;border-collapse:collapse;}
.fw-table th{text-align:left;color:var(--text3);font-size:11px;text-transform:uppercase;padding:15px;border-bottom:1px solid var(--border);}
.fw-table td{padding:15px;border-bottom:1px solid rgba(255,255,255,0.03);font-size:14px;color:var(--text2);}

.f-btn { background: var(--bg3); border: 1px solid var(--border); color: var(--text3); padding: 8px 15px; cursor: pointer; font-size: 11px; font-weight: 700; transition: 0.2s; }
.f-btn.active { background: var(--red); color: white; border-color: var(--red); }
</style>
</head>
<body>

<div id="loadOverlay" style="position:fixed; inset:0; background:var(--bg); z-index:1000; display:flex; flex-direction:column; align-items:center; justify-content:center;">
    <div class="fw-logo" style="width:160px; height:65px; font-size:28px;">RAHMAN</div>
    <div style="font-family:var(--font-mono); margin-top:20px; color:var(--text3); letter-spacing:5px;">INITIALIZING_...</div>
</div>

<div class="hdr">
    <div class="fw-logo">RAHMAN</div>
    <div class="hdr-title">Study Tracker</div>
    <div style="margin-left:auto; font-family:var(--font-mono); font-size:13px; color:var(--blue);" id="topClock">00:00:00</div>
</div>

<div class="quote-box">
    <div id="quote-text">"অপেক্ষা করো না, সময় কখনো একদম সঠিক হবে না।"</div>
    <div id="quote-auth">— নেপোলিয়ন হিল</div>
</div>

<div class="tabs">
    <div class="tab active" onclick="switchTab('timer', this)">Session</div>
    <div class="tab" onclick="switchTab('logs', this)">Records</div>
    <div class="tab" onclick="switchTab('dashboard', this)">Intelligence</div>
    <div class="tab" onclick="switchTab('weekly', this)">Weekly</div>
</div>

<div class="main">
    <div class="section active" id="sec-timer">
        <div class="timer-grid" id="timerGrid"></div>
    </div>
    
    <div class="section" id="sec-logs">
        <div style="background:var(--panel); padding:30px; border:1px solid var(--border);">
            <div id="filterContainer" style="display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;">
                <button class="f-btn active" onclick="setLogFilter('ALL', this)">ALL LOGS</button>
            </div>
            <table class="fw-table">
                <thead><tr><th>Date</th><th>Member</th><th>Duration</th><th>Topic</th></tr></thead>
                <tbody id="logsBody"></tbody>
            </table>
        </div>
    </div>

    <div class="section" id="sec-dashboard">
        <div class="dash-grid">
            <div class="stat-card"><div class="stat-lbl">Group Total</div><div class="stat-val" id="stat-total">0.00</div></div>
            <div class="stat-card"><div class="stat-lbl">Today's Focus</div><div class="stat-val" id="stat-today">0.00</div></div>
            <div class="stat-card">
                <div class="stat-lbl">Daily Goal (40h)</div>
                <div class="stat-val" style="color:var(--green)" id="goal-pct">0%</div>
                <div class="goal-bar-bg"><div class="goal-bar-fill" id="goal-bar" style="width:0%"></div></div>
            </div>
        </div>
        <div style="background:var(--panel); border:1px solid var(--border); padding:25px;">
            <div id="leaderBody"></div>
        </div>
    </div>

    <div class="section" id="sec-weekly">
        <div style="overflow-x:auto;">
            <table class="weekly-grid">
                <thead id="weeklyHead"></thead>
                <tbody id="weeklyBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyCP3cpWaAQ1i8C93a4F_5qsnk84KZ6CZtU",
    authDomain: "rahmansstudytracker.firebaseapp.com",
    databaseURL: "https://rahmansstudytracker-default-rtdb.firebaseio.com",
    projectId: "rahmansstudytracker",
    storageBucket: "rahmansstudytracker.firebasestorage.app",
    messagingSenderId: "456896961682",
    appId: "1:456896961682:web:ead674692696c88a625a4b"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const B_QUOTES = [
    {q: "সাফল্য মানেই শেষ নয়, ব্যর্থতা মানেই মৃত্যু নয়; আসল হলো এগিয়ে যাওয়ার সাহস ধরে রাখা।", a: "উইনস্টন চার্চিল"},
    {q: "স্বপ্ন সেটা নয় যা তুমি ঘুমিয়ে দেখো, স্বপ্ন সেটাই যা তোমাকে ঘুমাতে দেয় না।", a: "এ পি জে আব্দুল কালাম"},
    {q: "তুমি যদি এখন না পড়ো, তবে ভবিষ্যতে তোমাকে অন্যের স্বপ্নগুলো পূরণ করতে কাজ করতে হবে।", a: "অজ্ঞাত"},
    {q: "কঠিন পরিশ্রমের কোনো বিকল্প নেই।", a: "টমাস আলভা এডিসন"},
    {q: "অপেক্ষা করো না, সময় কখনো একদম সঠিক হবে না।", a: "নেপোলিয়ন হিল"}
];

const MEMBERS = ["Abdur Rahman", "Hannan", "Yasin Arafat", "Imtiaj Rahman", "Sabbir Rahman(Tahsin)", "Zidan Hasan", "Nadim"];
const M_COLORS = { "Abdur Rahman":"#00b4ff", "Hannan":"#00ff88", "Yasin Arafat":"#ffd600", "Imtiaj Rahman":"#bb86fc", "Sabbir Rahman(Tahsin)":"#ff3b3b", "Zidan Hasan":"#0070ff", "Nadim":"#ff9100" };
const SKEY = "fw_tracker_v3";

let ME = localStorage.getItem("fw_me");
let IS_ADMIN = localStorage.getItem("fw_role") === "admin";
let sessions = [], timers = {}, currentFilter = "ALL";

function elapsed(iso) {
    const ms = Date.now() - new Date(iso).getTime();
    const h = Math.floor(ms/3600000), m = Math.floor((ms%3600000)/60000), s = Math.floor((ms%60000)/1000);
    return `${h<10?'0'+h:h}:${m<10?'0'+m:m}:${s<10?'0'+s:s}`;
}

function initSync() {
    db.ref(SKEY).on('value', snap => {
        const data = snap.val() || {};
        sessions = data.sessions || [];
        timers = data.timers || {};
        reRender();
        document.getElementById("loadOverlay").style.display = "none";
    });
}

function reRender() {
    // 1. Timer Grid
    const grid = document.getElementById("timerGrid");
    grid.innerHTML = MEMBERS.map(m => {
        const isRun = !!timers[m];
        return `
        <div class="mcard ${isRun?'active-flair':''}" style="border-left: 4px solid ${M_COLORS[m]}">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div style="font-weight:800; color:${M_COLORS[m]}">${m.toUpperCase()}</div>
                ${isRun ? '<div style="display:flex; align-items:center; color:var(--red); font-size:11px; font-weight:700;"><span class="live-dot"></span>LIVE</div>' : ''}
            </div>
            <div class="timer-disp" id="tdisp-${m}">${isRun?elapsed(timers[m].startISO):'00:00:00'}</div>
            ${!IS_ADMIN && m===ME ? `
                <textarea id="tp-${m}" placeholder="What are you studying?">${timers[m]?.topics || ''}</textarea>
                <button class="btn ${isRun?'btn-stop':'btn-start'}" onclick="${isRun?'stopTimer()':'startTimer()'}">${isRun?'STOP':'START'}</button>
            ` : ''}
        </div>`;
    }).join("");

    // 2. Logs
    let filtered = [...sessions];
    if(currentFilter !== "ALL") filtered = filtered.filter(s => s.member === currentFilter);
    document.getElementById("logsBody").innerHTML = filtered.reverse().slice(0,30).map(s => `
        <tr><td>${s.date}</td><td style="font-weight:700; color:${M_COLORS[s.member]}">${s.member}</td><td>${s.hours.toFixed(2)}h</td><td>${s.topics||'—'}</td></tr>
    `).join("");

    // 3. Intelligence (Fluid Horizontal Bars)
    const totals = MEMBERS.map(m => ({ name: m, hrs: sessions.filter(s => s.member === m).reduce((a,b)=>a+b.hours,0) }));
    const maxHrs = Math.max(...totals.map(t => t.hrs), 1);
    const sorted = totals.sort((a,b) => b.hrs - a.hrs);
    
    document.getElementById("leaderBody").innerHTML = sorted.map((l, i) => {
        const pct = (l.hrs / maxHrs) * 100;
        const color = M_COLORS[l.name];
        return `
        <div class="h-bar-container">
            <div style="width:160px; font-weight:700; color:${color}; font-size:15px;">${l.name}</div>
            <div class="h-bar-wrap">
                <div class="h-bar-fill" style="width:${pct}%; background: linear-gradient(90deg, ${color}, ${color}dd, ${color});"></div>
            </div>
            <div style="width:60px; font-family:var(--font-mono); color:var(--green); text-align:right; font-weight:700;">${l.hrs.toFixed(1)}h</div>
        </div>`;
    }).join("");

    const todayHrs = sessions.filter(s => s.date === new Date().toISOString().slice(0,10)).reduce((a,b)=>a+b.hours,0);
    const goalPct = Math.min((todayHrs / 40) * 100, 100);
    document.getElementById("stat-total").textContent = sessions.reduce((a,b)=>a+b.hours,0).toFixed(2);
    document.getElementById("stat-today").textContent = todayHrs.toFixed(2);
    document.getElementById("goal-pct").textContent = goalPct.toFixed(1) + "%";
    document.getElementById("goal-bar").style.width = goalPct + "%";

    // 4. Modern Weekly Grid
    const curr = new Date();
    const first = curr.getDate() - curr.getDay() + (curr.getDay() === 0 ? -6 : 1);
    const week = [];
    for(let i=0; i<7; i++) week.push(new Date(new Date().setDate(first + i)).toISOString().slice(0,10));
    document.getElementById("weeklyHead").innerHTML = `<tr><th style="text-align:left; padding-left:25px;">Team Member</th>${week.map(d => `<th>${d.split('-').slice(1).join('/')}</th>`).join("")}</tr>`;
    document.getElementById("weeklyBody").innerHTML = MEMBERS.map(m => {
        const cells = week.map(d => {
            const h = sessions.filter(s => s.member === m && s.date === d).reduce((a,b)=>a+b.hours,0);
            return h > 0 
                ? `<td><span class="weekly-val" style="background:${M_COLORS[m]}15; color:${M_COLORS[m]}">${h.toFixed(1)}</span></td>`
                : `<td><span class="weekly-empty">••</span></td>`;
        }).join("");
        return `<tr><td style="color:${M_COLORS[m]}">${m}</td>${cells}</tr>`;
    }).join("");
}

function setLogFilter(name, btn) {
    currentFilter = name;
    document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    reRender();
}

function switchTab(id, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('sec-'+id).classList.add('active');
}

async function startTimer() {
    timers[ME] = { startISO: new Date().toISOString(), topics: document.getElementById("tp-"+ME).value };
    await db.ref(SKEY).set({ sessions, timers });
}

async function stopTimer() {
    const t = timers[ME];
    const hrs = (new Date() - new Date(t.startISO)) / 3600000;
    if(hrs > 0.01) sessions.push({ member: ME, date: new Date().toISOString().slice(0,10), hours: hrs, topics: document.getElementById("tp-"+ME).value });
    delete timers[ME];
    await db.ref(SKEY).set({ sessions, timers });
}

function updateQuote() {
    const q = B_QUOTES[Math.floor(Math.random() * B_QUOTES.length)];
    const textEl = document.getElementById("quote-text");
    textEl.style.opacity = 0;
    setTimeout(() => {
        textEl.textContent = `"${q.q}"`;
        document.getElementById("quote-auth").textContent = `— ${q.a}`;
        textEl.style.opacity = 1;
    }, 500);
}

window.onload = () => {
    if(!ME && !IS_ADMIN) {
        document.getElementById("loadOverlay").innerHTML = `
            <div class="fw-logo" style="margin-bottom:30px">SELECT_USER</div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; width:90%; max-width:400px;">
                ${MEMBERS.map(m => `<button class="f-btn" style="padding:15px" onclick="localStorage.setItem('fw_me','${m}');location.reload()">${m}</button>`).join("")}
                <button class="f-btn" style="grid-column:span 2; background:var(--blue); color:white; padding:15px" onclick="localStorage.setItem('fw_role','admin');location.reload()">ADMINISTRATOR VIEW</button>
            </div>`;
    } else {
        const fCont = document.getElementById("filterContainer");
        MEMBERS.forEach(m => {
            const b = document.createElement("button");
            b.className = "f-btn";
            b.textContent = m.split(" ")[0];
            b.onclick = (e) => setLogFilter(m, e.target);
            fCont.appendChild(b);
        });
        initSync();
        setInterval(updateQuote, 15000); 
        setInterval(() => {
            document.getElementById("topClock").textContent = new Date().toLocaleTimeString();
            MEMBERS.forEach(m => { if(timers[m]) document.getElementById("tdisp-"+m).textContent = elapsed(timers[m].startISO); });
        }, 1000);
    }
};
</script>
</body>
</html>
