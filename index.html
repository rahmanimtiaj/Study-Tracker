<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Tracker - Modern Pro</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=Outfit:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<style>
:root {
  --bg:#04040c; --bg2:#080814; --bg3:#0e0e1c; --panel:#0b0b18;
  --border:#1a1a30; --border-bright:#35356a;
  --green:#7dd3a8; --red:#e07070; --blue:#7ab3d4; --yellow:#d4b896; --purple:#a98ec9;
  --text:#e8e4dc; --text2:#8a8478; --text3:#3e3a34;
  --flair-green: rgba(125, 211, 168, 0.05);
  --flair-blue: rgba(122, 179, 212, 0.04);
  --font-main: 'Outfit', sans-serif;
  --font-mono: 'DM Mono', monospace;
  --font-head: 'DM Serif Display', serif;
  --font-accent: 'Cormorant Garamond', serif;
  --radius: 6px;
  --glow-green: 0 0 20px rgba(125,211,168,0.12), 0 0 60px rgba(125,211,168,0.04);
  --glow-red: 0 0 20px rgba(224,112,112,0.18);
}

*{box-sizing:border-box;margin:0;padding:0}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-main);
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content:'';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 0% 0%, rgba(0,255,163,0.06) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 100% 100%, rgba(56,182,255,0.05) 0%, transparent 50%),
    radial-gradient(ellipse 40% 30% at 50% 50%, rgba(255,41,82,0.03) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

body > * { position: relative; z-index: 1; }

/* SCANLINE EFFECT */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
  pointer-events: none;
  z-index: 999;
}

/* ======= ANIMATIONS ======= */
@keyframes flairPulse {
  0%,100% { box-shadow: 0 0 0 1px rgba(0,255,163,0.2), 0 0 30px rgba(0,255,163,0.08); }
  50% { box-shadow: 0 0 0 1px rgba(0,255,163,0.5), 0 0 60px rgba(0,255,163,0.18); }
}
@keyframes blinkRed {
  0%,100% { opacity:1; box-shadow: 0 0 8px var(--red); }
  50% { opacity:0.1; box-shadow: none; }
}
@keyframes fluidFlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
@keyframes fadeIn {
  from { opacity:0; transform: translateY(8px); }
  to { opacity:1; transform: translateY(0); }
}
@keyframes slideIn {
  from { opacity:0; transform: translateX(-12px); }
  to { opacity:1; transform: translateX(0); }
}
@keyframes rankBump {
  0% { transform: scale(1); }
  40% { transform: scale(1.04); }
  100% { transform: scale(1); }
}
@keyframes shimmer {
  0% { background-position: -200% center; }
  100% { background-position: 200% center; }
}
@keyframes topGlow {
  0%,100% { box-shadow: inset 0 0 40px rgba(255,215,0,0.04), 0 0 0 1px rgba(255,215,0,0.25); }
  50% { box-shadow: inset 0 0 80px rgba(255,215,0,0.10), 0 0 0 1px rgba(255,215,0,0.5); }
}

/* ======= HEADER ======= */
.hdr {
  background: rgba(7,7,16,0.95);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 30px;
  display: flex;
  align-items: center;
  height: 68px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.fw-logo {
  width: 110px; height: 40px;
  background: linear-gradient(135deg, var(--red), #c45a5a);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-head); font-weight: 400; font-size: 17px; color: #fff;
  clip-path: polygon(8% 0%, 100% 0%, 92% 100%, 0% 100%);
  letter-spacing: 2px;
  box-shadow: var(--glow-red);
}
.hdr-title {
  margin-left: 18px;
  font-size: 13px;
  font-weight: 300;
  text-transform: uppercase;
  letter-spacing: 6px;
  color: var(--text2);
}
.hdr-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 20px;
}
.top-clock {
  font-family: var(--font-mono);
  font-size: 14px;
  color: var(--blue);
  letter-spacing: 2px;
  text-shadow: 0 0 15px rgba(56,182,255,0.4);
}
.hdr-user-badge {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--green);
  background: rgba(0,255,163,0.08);
  border: 1px solid rgba(0,255,163,0.2);
  padding: 4px 10px;
  border-radius: 3px;
  letter-spacing: 1px;
}

/* ======= QUOTE ======= */
.quote-box {
  padding: 36px 20px;
  text-align: center;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, transparent, rgba(7,7,16,0.6));
  position: relative;
  overflow: hidden;
}
.quote-box::before {
  content: '"';
  position: absolute;
  top: -20px; left: 30px;
  font-size: 180px;
  color: rgba(0,255,163,0.04);
  font-family: Georgia, serif;
  line-height: 1;
  pointer-events: none;
}
#quote-text {
  font-size: 21px;
  color: var(--text2);
  max-width: 760px;
  margin: 0 auto;
  line-height: 1.8;
  transition: opacity 0.6s;
  font-weight: 400;
  font-family: var(--font-accent);
  font-style: italic;
  letter-spacing: 0.3px;
}
#quote-auth {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 4px;
  color: var(--red);
  margin-top: 12px;
  font-weight: 700;
}

/* ======= TABS ======= */
.tabs {
  background: rgba(7,7,16,0.9);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 30px;
  display: flex;
  gap: 0;
  position: sticky;
  top: 68px;
  z-index: 99;
}
.tab {
  padding: 18px 24px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--text3);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.3s;
  position: relative;
}
.tab:hover { color: var(--text2); }
.tab.active {
  color: var(--text);
  border-bottom-color: var(--red);
}
.tab.active::after {
  content: '';
  position: absolute;
  bottom: -1px; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--red), transparent);
}

/* ======= MAIN ======= */
.main { padding: 30px; max-width: 1300px; margin: 0 auto; }
.section { display: none; }
.section.active { display: block; animation: fadeIn 0.4s ease; }

/* ======= SESSION CARDS ======= */
.timer-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
  gap: 16px;
}

.mcard {
  background: var(--panel);
  border: 1px solid var(--border);
  padding: 22px;
  border-radius: var(--radius);
  transition: all 0.4s;
  position: relative;
  overflow: hidden;
  animation: fadeIn 0.5s ease both;
}

.mcard::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--member-color, var(--green)), transparent);
  opacity: 0.5;
}

.mcard.active-flair {
  animation: flairPulse 3s infinite;
  border-color: rgba(0,255,163,0.3);
}

.mcard.rank-1 {
  animation: topGlow 3s infinite;
  border-color: rgba(255,215,0,0.3) !important;
}
.mcard.rank-1::before {
  background: linear-gradient(90deg, transparent, gold, transparent) !important;
  opacity: 0.7;
}

.mcard-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 5px;
}

.member-name {
  font-weight: 400;
  font-size: 17px;
  letter-spacing: 0.5px;
  font-family: var(--font-head);
}

.rank-badge {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 20px;
  border: 1px solid;
  letter-spacing: 1px;
}

.live-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--red);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.live-dot {
  width: 8px; height: 8px;
  background: var(--red);
  border-radius: 50%;
  animation: blinkRed 1s infinite;
}

.timer-disp {
  font-family: var(--font-mono);
  font-size: 44px;
  color: var(--green);
  margin: 14px 0;
  text-align: center;
  text-shadow: 0 0 18px rgba(125,211,168,0.25);
  letter-spacing: 3px;
  animation: glowPulse 5s infinite;
}

@keyframes glowPulse {
  0%,100% { text-shadow: 0 0 10px rgba(125,211,168,0.2); }
  50% { text-shadow: 0 0 25px rgba(125,211,168,0.5), 0 0 5px rgba(125,211,168,0.3); }
}

.mcard:not(.active-flair) .timer-disp {
  color: var(--text3);
  text-shadow: none;
  animation: none;
  font-size: 38px;
}

.study-topic-area {
  position: relative;
  margin-bottom: 10px;
}

textarea {
  width: 100%;
  background: rgba(0,0,0,0.3);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 10px 12px;
  color: var(--text);
  resize: none;
  font-family: var(--font-main);
  font-size: 13px;
  line-height: 1.5;
  transition: border-color 0.3s, box-shadow 0.3s;
  outline: none;
}
textarea:focus {
  border-color: var(--border-bright);
  box-shadow: 0 0 0 2px rgba(56,182,255,0.08);
}
textarea::placeholder { color: var(--text3); font-size: 12px; }

.char-hint {
  font-size: 10px;
  color: var(--text3);
  text-align: right;
  margin-top: 4px;
  font-family: var(--font-mono);
  transition: color 0.3s;
}
.char-hint.ok { color: var(--green); }
.char-hint.warn { color: var(--red); }

.btn {
  padding: 13px;
  border: none;
  font-weight: 800;
  cursor: pointer;
  text-transform: uppercase;
  font-family: var(--font-head);
  font-size: 15px;
  width: 100%;
  border-radius: 4px;
  letter-spacing: 3px;
  transition: all 0.25s;
  position: relative;
  overflow: hidden;
}
.btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(rgba(255,255,255,0.1), transparent);
  opacity: 0;
  transition: opacity 0.2s;
}
.btn:hover::after { opacity: 1; }
.btn:active { transform: scale(0.98); }
.btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
  transform: none;
}
.btn-start {
  background: linear-gradient(135deg, #00ffa3, #00d4a1);
  color: var(--bg);
  box-shadow: 0 4px 20px rgba(0,255,163,0.2);
}
.btn-start:hover { box-shadow: 0 4px 30px rgba(0,255,163,0.4); }
.btn-stop {
  background: linear-gradient(135deg, var(--red), #ff6b6b);
  color: #fff;
  box-shadow: 0 4px 20px rgba(255,41,82,0.25);
}
.btn-stop:hover { box-shadow: 0 4px 30px rgba(255,41,82,0.45); }

.session-hours-small {
  text-align: center;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text3);
  margin-bottom: 12px;
  letter-spacing: 1px;
}

.topic-display {
  background: rgba(0,0,0,0.2);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 8px 12px;
  font-size: 12px;
  color: var(--text2);
  min-height: 36px;
  font-style: italic;
  margin-bottom: 0;
}

/* ======= STATS ======= */
.dash-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 16px;
  margin-bottom: 30px;
}
.stat-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px;
  position: relative;
  overflow: hidden;
  transition: border-color 0.3s;
}
.stat-card:hover { border-color: var(--border-bright); }
.stat-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--blue), transparent);
  opacity: 0.4;
}
.stat-lbl {
  font-size: 10px;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 10px;
  letter-spacing: 2px;
}
.stat-val {
  font-size: 38px;
  font-weight: 800;
  font-family: var(--font-head);
  line-height: 1;
  background: linear-gradient(135deg, var(--text), var(--text2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.goal-bar-bg {
  width: 100%;
  height: 4px;
  background: var(--bg);
  border-radius: 2px;
  margin-top: 12px;
  overflow: hidden;
}
.goal-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--green), #00d4a1);
  transition: width 1.2s cubic-bezier(0.4,0,0.2,1);
  box-shadow: 0 0 10px rgba(0,255,163,0.5);
  border-radius: 2px;
}

/* ======= INTELLIGENCE BARS ======= */
.intel-panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px;
}
.intel-title {
  font-family: var(--font-head);
  font-size: 12px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 24px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
}

.h-bar-container {
  display: flex;
  align-items: center;
  gap: 16px;
  width: 100%;
  padding: 10px 0;
  animation: slideIn 0.5s ease both;
}
.h-bar-name {
  width: 180px;
  font-weight: 700;
  font-size: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.h-bar-wrap {
  flex-grow: 1;
  height: 20px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  position: relative;
}
.h-bar-fill {
  height: 100%;
  border-radius: 10px;
  transition: width 1.5s cubic-bezier(0.4,0,0.2,1);
  background-size: 200% 100%;
  animation: fluidFlow 4s infinite linear;
  position: relative;
}
.h-bar-fill::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 50%;
  background: rgba(255,255,255,0.12);
  border-radius: 10px 10px 0 0;
}
.h-bar-hrs {
  width: 55px;
  font-family: var(--font-mono);
  color: var(--green);
  text-align: right;
  font-weight: 700;
  font-size: 13px;
}

/* ======= LOGS ======= */
.logs-panel {
  background: var(--panel);
  padding: 28px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.filter-row {
  display: flex;
  gap: 8px;
  margin-bottom: 22px;
  flex-wrap: wrap;
}
.f-btn {
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--text3);
  padding: 7px 14px;
  cursor: pointer;
  font-size: 10px;
  font-weight: 700;
  font-family: var(--font-head);
  letter-spacing: 2px;
  text-transform: uppercase;
  border-radius: 3px;
  transition: all 0.2s;
}
.f-btn:hover { border-color: var(--border-bright); color: var(--text2); }
.f-btn.active {
  background: var(--red);
  color: white;
  border-color: var(--red);
  box-shadow: 0 0 15px rgba(255,41,82,0.25);
}

.fw-table { width: 100%; border-collapse: collapse; }
.fw-table th {
  text-align: left;
  color: var(--text3);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 2px;
  padding: 12px 15px;
  border-bottom: 1px solid var(--border);
  font-family: var(--font-head);
}
.fw-table td {
  padding: 13px 15px;
  border-bottom: 1px solid rgba(255,255,255,0.025);
  font-size: 13px;
  color: var(--text2);
  transition: background 0.2s;
}
.fw-table tr:hover td { background: rgba(255,255,255,0.02); }
.fw-table tr:last-child td { border-bottom: none; }

/* ======= WEEKLY ======= */
.weekly-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--border); }
.weekly-grid { width: 100%; border-collapse: separate; border-spacing: 0; }
.weekly-grid th {
  color: var(--text3);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 2px;
  padding: 16px 10px;
  text-align: center;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  font-family: var(--font-head);
}
.weekly-grid th:first-child { text-align: left; padding-left: 25px; }
.weekly-grid td {
  background: var(--panel);
  padding: 16px 10px;
  text-align: center;
  font-size: 13px;
  color: var(--text2);
  border-bottom: 1px solid var(--border);
  transition: background 0.2s;
}
.weekly-grid tr:last-child td { border-bottom: none; }
.weekly-grid td:first-child {
  text-align: left;
  padding-left: 25px;
  font-weight: 700;
  font-size: 14px;
}
.weekly-grid tr:hover td { background: rgba(255,255,255,0.018); }
.weekly-val {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 4px;
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 12px;
}
.weekly-empty { color: var(--text3); opacity: 0.3; font-size: 12px; }

/* ======= LOAD OVERLAY ======= */
#loadOverlay {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 1000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
}
.load-logo {
  width: 180px; height: 70px;
  background: linear-gradient(135deg, var(--red), #ff6b35);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-head); font-weight: 900; font-size: 30px; color: #fff;
  clip-path: polygon(8% 0%, 100% 0%, 92% 100%, 0% 100%);
  letter-spacing: 3px;
  box-shadow: var(--glow-red);
  margin-bottom: 24px;
}
.load-status {
  font-family: var(--font-mono);
  color: var(--text3);
  letter-spacing: 5px;
  font-size: 11px;
}
.load-bar-wrap {
  width: 200px;
  height: 2px;
  background: var(--border);
  margin-top: 20px;
  overflow: hidden;
}
.load-bar-inner {
  height: 100%;
  background: var(--green);
  width: 0%;
  transition: width 1s;
  box-shadow: 0 0 10px var(--green);
}

/* ======= USER SELECT ======= */
.user-select-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  width: 92%;
  max-width: 440px;
  margin-top: 20px;
}
.user-btn {
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--text2);
  padding: 16px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 700;
  font-family: var(--font-head);
  letter-spacing: 1px;
  border-radius: 4px;
  transition: all 0.25s;
  text-transform: uppercase;
}
.user-btn:hover {
  border-color: var(--border-bright);
  color: var(--text);
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(0,0,0,0.3);
}

/* ======= DIVIDER ======= */
.section-divider {
  display: flex;
  align-items: center;
  gap: 15px;
  margin: 28px 0 20px;
  color: var(--text3);
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  font-family: var(--font-head);
}
.section-divider::before,
.section-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* ======= RESPONSIVE ======= */
@media (max-width: 600px) {
  .hdr { padding: 0 16px; }
  .hdr-title { display: none; }
  .main { padding: 16px; }
  .timer-grid { grid-template-columns: 1fr; }
  .tabs { padding: 0 10px; gap: 0; }
  .tab { padding: 14px 12px; font-size: 9px; letter-spacing: 1px; }
  .user-select-grid { grid-template-columns: 1fr; }
  .h-bar-name { width: 120px; font-size: 12px; }
}
</style>
</head>
<body>

<!-- LOAD OVERLAY -->
<div id="loadOverlay">
  <div class="load-logo">RAHMAN</div>
  <div class="load-status" id="loadStatus">INITIALIZING_...</div>

<!-- MAIN CONTENT -->
<div class="main">

      </table>

</div>

<script>
// ============================================================
//  FIREBASE CONFIG — DO NOT MODIFY
// ============================================================
const firebaseConfig = {
    apiKey: "AIzaSyCP3cpWaAQ1i8C93a4F_5qsnk84KZ6CZtU",
    authDomain: "rahmansstudytracker.firebaseapp.com",
    databaseURL: "https://rahmansstudytracker-default-rtdb.firebaseio.com",
    projectId: "rahmansstudytracker",
    storageBucket: "rahmansstudytracker.firebasestorage.app",
    messagingSenderId: "456896961682",
    appId: "1:456896961682:web:ead674692696c88a625a4b"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ============================================================
//  CONSTANTS
// ============================================================
const B_QUOTES = [
    {q: "সাফল্য মানেই শেষ নয়, ব্যর্থতা মানেই মৃত্যু নয়; আসল হলো এগিয়ে যাওয়ার সাহস ধরে রাখা।", a: "উইনস্টন চার্চিল"},
    {q: "স্বপ্ন সেটা নয় যা তুমি ঘুমিয়ে দেখো, স্বপ্ন সেটাই যা তোমাকে ঘুমাতে দেয় না।", a: "এ পি জে আব্দুল কালাম"},
    {q: "তুমি যদি এখন না পড়ো, তবে ভবিষ্যতে তোমাকে অন্যের স্বপ্নগুলো পূরণ করতে কাজ করতে হবে।", a: "অজ্ঞাত"},
    {q: "কঠিন পরিশ্রমের কোনো বিকল্প নেই।", a: "টমাস আলভা এডিসন"},
    {q: "অপেক্ষা করো না, সময় কখনো একদম সঠিক হবে না।", a: "নেপোলিয়ন হিল"},
    {q: "আজকের পরিশ্রম আগামীকালের সাফল্যের ভিত্তি।", a: "অজ্ঞাত"},
    {q: "প্রতিটি বিশেষজ্ঞ একসময় শিক্ষার্থী ছিলেন।", a: "হেলেন হেইস"}
];

// ============================================================
//  MEMBERS LIST — added Tanbirur Rahman (Taskin)
// ============================================================
const MEMBERS = [
    "Abdur Rahman",
    "Hannan",
    "Yasin Arafat",
    "Imtiaj Rahman",
    "Sabbir Rahman(Tahsin)",
    "Zidan Hasan",
    "Nadim",
    "Tanbirur Rahman (Taskin)"
];

const M_COLORS = {
    "Abdur Rahman":           "#7ab8d4",
    "Hannan":                 "#7dd3a8",
    "Yasin Arafat":           "#c4a96b",
    "Imtiaj Rahman":          "#a98ec9",
    "Sabbir Rahman(Tahsin)":  "#d48a8a",
    "Zidan Hasan":            "#6b9fd4",
    "Nadim":                  "#d4a06b",
    "Tanbirur Rahman (Taskin)": "#c48aad"
};

const SKEY = "fw_tracker_v3";

let ME = localStorage.getItem("fw_me");
let IS_ADMIN = localStorage.getItem("fw_role") === "admin";
let sessions = [], timers = {}, currentFilter = "ALL";

// ============================================================
//  HELPERS
// ============================================================
function elapsed(iso) {
    const ms = Date.now() - new Date(iso).getTime();
    const h = Math.floor(ms / 3600000);
    const m = Math.floor((ms % 3600000) / 60000);
    const s = Math.floor((ms % 60000) / 1000);
    return `${pad(h)}:${pad(m)}:${pad(s)}`;
}
function pad(n) { return n < 10 ? '0' + n : n; }
function elapsedHrs(iso) { return (Date.now() - new Date(iso).getTime()) / 3600000; }

// ============================================================
//  FIREBASE SYNC
// ============================================================
function initSync() {
    db.ref(SKEY).on('value', snap => {
        const data = snap.val() || {};
        sessions = data.sessions || [];
        timers = data.timers || {};
        reRender();
        // Remove load overlay
        document.getElementById("loadOverlay").style.display = "none";
    });
}

// ============================================================
//  SORTING — live members (by current session hrs desc), then offline by total hrs desc
// ============================================================
function getSortedMembers() {
    return [...MEMBERS].sort((a, b) => {
        const aLive = !!timers[a];
        const bLive = !!timers[b];

        if (aLive && bLive) {
            // Both live: sort by current session duration descending
            return elapsedHrs(timers[b].startISO) - elapsedHrs(timers[a].startISO);
        }
        if (aLive) return -1;
        if (bLive) return 1;
        // Both offline: sort by total hours descending
        const aTotal = sessions.filter(s => s.member === a).reduce((x, y) => x + y.hours, 0);
        const bTotal = sessions.filter(s => s.member === b).reduce((x, y) => x + y.hours, 0);
        return bTotal - aTotal;
    });
}

// ============================================================
//  MAIN RENDER
// ============================================================
function reRender() {
    renderTimer();
    renderLogs();
    renderDashboard();
    renderWeekly();
}

function renderTimer() {
    const sorted = getSortedMembers();
    const liveCount = sorted.filter(m => !!timers[m]).length;

    document.getElementById("timerGrid").innerHTML = sorted.map((m, idx) => {
        const isRun = !!timers[m];
        const color = M_COLORS[m];
        const isTopLive = isRun && idx === 0;
        const rankAmongLive = isRun ? sorted.filter(x => !!timers[x]).indexOf(m) : -1;

        const totalHrs = sessions.filter(s => s.member === m).reduce((a, b) => a + b.hours, 0);

        let rankBadgeHTML = '';
        if (isRun) {
            const medals = ['🥇', '🥈', '🥉'];
            const medal = rankAmongLive < 3 ? medals[rankAmongLive] : `#${rankAmongLive + 1}`;
            rankBadgeHTML = `<span class="rank-badge" style="color:${color}; border-color:${color}40; background:${color}10;">${medal} LIVE</span>`;
        }

        const cardClass = `mcard${isRun ? ' active-flair' : ''}${isTopLive ? ' rank-1' : ''}`;

        // Controls — only for logged-in user (not admin)
        let controlsHTML = '';
        if (!IS_ADMIN && m === ME) {
            if (isRun) {
                controlsHTML = `
                    <div class="study-topic-area">
                        <textarea id="tp-${m}" rows="2" placeholder="What are you studying?">${timers[m]?.topics || ''}</textarea>
                        <div class="char-hint ok" id="hint-${m}">Studying...</div>
                    </div>
                    <button class="btn btn-stop" onclick="stopTimer()">⏹ Stop Session</button>`;
            } else {
                controlsHTML = `
                    <div class="study-topic-area">
                        <textarea id="tp-${m}" rows="2" placeholder="What are you studying?" oninput="checkInput('${m}')" maxlength="200"></textarea>
                        <div class="char-hint warn" id="hint-${m}">Min 3 characters required</div>
                    </div>
                    <button class="btn btn-start" id="startBtn-${m}" onclick="startTimer()" disabled>▶ Start Session</button>`;
            }
        } else if (isRun && timers[m]?.topics) {
            controlsHTML = `<div class="topic-display">📚 ${timers[m].topics}</div>`;
        }

        return `
        <div class="${cardClass}" style="--member-color:${color}; border-left: 3px solid ${color}; animation-delay:${idx * 0.05}s">
            <div class="mcard-header">
                <div class="member-name" style="color:${color}">${m}</div>
                <div style="display:flex; align-items:center; gap:8px;">
                    ${isRun ? '<div class="live-badge"><span class="live-dot"></span>LIVE</div>' : ''}
                    ${rankBadgeHTML}
                </div>
            </div>
            <div class="session-hours-small">${totalHrs > 0 ? `Total: ${totalHrs.toFixed(1)}h` : 'No sessions yet'}</div>
            <div class="timer-disp" id="tdisp-${m}">${isRun ? elapsed(timers[m].startISO) : '00:00:00'}</div>
            ${controlsHTML}
        </div>`;
    }).join("");
}

function checkInput(member) {
    const ta = document.getElementById(`tp-${member}`);
    const hint = document.getElementById(`hint-${member}`);
    const btn = document.getElementById(`startBtn-${member}`);
    if (!ta || !btn) return;
    const len = ta.value.trim().length;
    if (len >= 3) {
        btn.disabled = false;
        hint.textContent = `✓ Ready to start`;
        hint.className = 'char-hint ok';
    } else {
        btn.disabled = true;
        hint.textContent = `Min 3 characters required (${len}/3)`;
        hint.className = 'char-hint warn';
    }
}

function renderLogs() {
    let filtered = [...sessions];
    if (currentFilter !== "ALL") filtered = filtered.filter(s => s.member === currentFilter);
    document.getElementById("logsBody").innerHTML = filtered.reverse().slice(0, 40).map(s => `
        <tr>
            <td>${s.date}</td>
            <td style="font-weight:700; color:${M_COLORS[s.member]}">${s.member}</td>
            <td><span style="font-family:var(--font-mono); color:var(--green)">${s.hours.toFixed(2)}h</span></td>
            <td style="color:var(--text2)">${s.topics || '—'}</td>
        </tr>`).join("");
}

function renderDashboard() {
    const totals = MEMBERS.map(m => ({
        name: m,
        hrs: sessions.filter(s => s.member === m).reduce((a, b) => a + b.hours, 0)
    }));
    const maxHrs = Math.max(...totals.map(t => t.hrs), 1);
    const sorted = totals.sort((a, b) => b.hrs - a.hrs);

    document.getElementById("leaderBody").innerHTML = sorted.map((l, i) => {
        const pct = (l.hrs / maxHrs) * 100;
        const color = M_COLORS[l.name];
        const medals = ['🥇', '🥈', '🥉'];
        const rankLabel = i < 3 ? medals[i] : `#${i+1}`;
        return `
        <div class="h-bar-container" style="animation-delay:${i * 0.08}s">
            <div class="h-bar-name" style="color:${color}">${rankLabel} ${l.name}</div>
            <div class="h-bar-wrap">
                <div class="h-bar-fill" style="width:${pct}%; background: linear-gradient(90deg, ${color}cc, ${color}, ${color}dd);"></div>
            </div>
            <div class="h-bar-hrs">${l.hrs.toFixed(1)}h</div>
        </div>`;
    }).join("");

    const todayStr = new Date().toISOString().slice(0, 10);
    const todayHrs = sessions.filter(s => s.date === todayStr).reduce((a, b) => a + b.hours, 0);
    const totalHrs = sessions.reduce((a, b) => a + b.hours, 0);
    const goalPct = Math.min((todayHrs / 40) * 100, 100);

    document.getElementById("stat-total").textContent = totalHrs.toFixed(2);
    document.getElementById("stat-today").textContent = todayHrs.toFixed(2);
    document.getElementById("goal-pct").textContent = goalPct.toFixed(1) + "%";
    document.getElementById("goal-bar").style.width = goalPct + "%";
}

function renderWeekly() {
    const curr = new Date();
    const dow = curr.getDay();
    const first = curr.getDate() - dow + (dow === 0 ? -6 : 1);
    const week = [];
    for (let i = 0; i < 7; i++) {
        const d = new Date(curr);
        d.setDate(first + i);
        week.push(d.toISOString().slice(0, 10));
    }
    document.getElementById("weeklyHead").innerHTML = `
        <tr>
            <th style="text-align:left; padding-left:25px;">Member</th>
            ${week.map(d => `<th>${d.split('-').slice(1).join('/')}</th>`).join("")}
        </tr>`;
    document.getElementById("weeklyBody").innerHTML = MEMBERS.map(m => {
        const color = M_COLORS[m];
        const cells = week.map(d => {
            const h = sessions.filter(s => s.member === m && s.date === d).reduce((a, b) => a + b.hours, 0);
            return h > 0
                ? `<td><span class="weekly-val" style="background:${color}18; color:${color}">${h.toFixed(1)}</span></td>`
                : `<td><span class="weekly-empty">••</span></td>`;
        }).join("");
        return `<tr><td style="color:${color}">${m}</td>${cells}</tr>`;
    }).join("");
}

// ============================================================
//  FILTER
// ============================================================
function setLogFilter(name, btn) {
    currentFilter = name;
    document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderLogs();
}

// ============================================================
//  TAB SWITCH
// ============================================================
function switchTab(id, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('sec-' + id).classList.add('active');
}

// ============================================================
//  TIMER CONTROLS
// ============================================================
async function startTimer() {
    const ta = document.getElementById("tp-" + ME);
    if (!ta) return;
    const topic = ta.value.trim();
    if (topic.length < 3) {
        ta.style.borderColor = 'var(--red)';
        setTimeout(() => ta.style.borderColor = '', 1000);
        return;
    }
    timers[ME] = { startISO: new Date().toISOString(), topics: topic };
    await db.ref(SKEY).set({ sessions, timers });
}

async function stopTimer() {
    const t = timers[ME];
    if (!t) return;
    const hrs = (Date.now() - new Date(t.startISO).getTime()) / 3600000;
    const topicEl = document.getElementById("tp-" + ME);
    const topic = topicEl ? topicEl.value.trim() : (t.topics || '');
    if (hrs > 0.01) {
        sessions.push({
            member: ME,
            date: new Date().toISOString().slice(0, 10),
            hours: hrs,
            topics: topic
        });
    }
    delete timers[ME];
    await db.ref(SKEY).set({ sessions, timers });
}

// ============================================================
//  QUOTES
// ============================================================
function updateQuote() {
    const q = B_QUOTES[Math.floor(Math.random() * B_QUOTES.length)];
    const textEl = document.getElementById("quote-text");
    textEl.style.opacity = 0;
    setTimeout(() => {
        textEl.textContent = `"${q.q}"`;
        document.getElementById("quote-auth").textContent = `— ${q.a}`;
        textEl.style.opacity = 1;
    }, 600);
}

// ============================================================
//  CLOCK + LIVE TIMER TICK
// ============================================================
function tick() {
    document.getElementById("topClock").textContent = new Date().toLocaleTimeString();
    MEMBERS.forEach(m => {
        const el = document.getElementById("tdisp-" + m);
        if (el && timers[m]) el.textContent = elapsed(timers[m].startISO);
    });
}

// ============================================================
//  INIT
// ============================================================
window.onload = () => {
    // Animate load bar
    const bar = document.getElementById("loadBar");
    const status = document.getElementById("loadStatus");
    let pct = 0;
    const loadInt = setInterval(() => {
        pct += Math.random() * 15;
        if (pct > 90) pct = 90;
        bar.style.width = pct + "%";
    }, 200);

    if (!ME && !IS_ADMIN) {
        // User selection screen
        setTimeout(() => {
            clearInterval(loadInt);
            bar.style.width = "100%";
            status.textContent = "SELECT YOUR PROFILE";
            document.getElementById("loadOverlay").innerHTML = `
                <div class="load-logo" style="margin-bottom:30px">SELECT</div>
                <div style="font-family:var(--font-mono); color:var(--text3); letter-spacing:4px; font-size:11px; margin-bottom:24px;">WHO ARE YOU?</div>
                <div class="user-select-grid">
                    ${MEMBERS.map(m => `<button class="user-btn" style="border-color:${M_COLORS[m]}40; color:${M_COLORS[m]}" onclick="localStorage.setItem('fw_me','${m}');location.reload()">${m}</button>`).join("")}
                    <button class="user-btn" style="grid-column:span 2; background:rgba(56,182,255,0.1); border-color:rgba(56,182,255,0.4); color:var(--blue);" onclick="localStorage.setItem('fw_role','admin');location.reload()">👁 ADMINISTRATOR VIEW</button>
                </div>`;
        }, 800);
    } else {
        // Build filter buttons
        const fCont = document.getElementById("filterContainer");
        MEMBERS.forEach(m => {
            const b = document.createElement("button");
            b.className = "f-btn";
            b.textContent = m.split(" ")[0];
            b.onclick = (e) => setLogFilter(m, e.target);
            fCont.appendChild(b);
        });

        // Show user badge
        if (ME) {
            const badge = document.getElementById("userBadge");
            badge.textContent = ME.split(" ")[0].toUpperCase();
            badge.style.display = 'block';
            badge.style.borderColor = M_COLORS[ME] + '60';
            badge.style.color = M_COLORS[ME];
        }

        // Connect Firebase
        initSync();

        // Animate load bar to complete
        clearInterval(loadInt);
        bar.style.width = "100%";
        status.textContent = "CONNECTING TO DATABASE...";

        // Quote rotation
        setInterval(updateQuote, 15000);

        // Clock tick
        setInterval(tick, 1000);
    }
};
</script>
