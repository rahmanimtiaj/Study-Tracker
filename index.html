<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&family=League+Spartan:wght@300;400;700;900&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<style>
:root {
  --bg:#050508; --bg2:#0a0a12; --bg3:#11111f; --panel:#0d0d18;
  --border:#1f1f35; --border-bright:#3a3a5a;
  --green:#00ffa3; --red:#ff2d55; --blue:#00d2ff; --yellow:#ffcc00;
  --text:#f0f0f5; --text2:#a0a0c0; --text3:#505070;
  --flair-green: rgba(0, 255, 163, 0.05);
  --font-main: 'League Spartan', sans-serif;
  --font-mono: 'Share Tech Mono', monospace;
  --font-head: 'Rajdhani', sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}
body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-main);
    min-height: 100vh;
    overflow-x: hidden;
    letter-spacing: 0.5px;
    background-image: 
        radial-gradient(circle at 0% 0%, var(--flair-green) 0%, transparent 40%),
        radial-gradient(circle at 100% 100%, var(--flair-green) 0%, transparent 40%);
}

@keyframes flairPulse {
    0% { box-shadow: 0 0 20px rgba(0, 255, 163, 0.05); }
    50% { box-shadow: 0 0 40px rgba(0, 255, 163, 0.15); }
    100% { box-shadow: 0 0 20px rgba(0, 255, 163, 0.05); }
}

.m_bold { font-weight: 800 !important; }

.hdr{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 30px;display:flex;align-items:center;height:65px;position:sticky;top:0;z-index:100}
.fw-logo{width:100px;height:38px;background:var(--red);display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-weight:900;font-size:16px;color:#fff;letter-spacing:1px;clip-path:polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%);}
.hdr-title{margin-left:15px; font-size:20px; font-weight:300; text-transform:uppercase; letter-spacing:4px; color:var(--text);}
.live-clock{margin-left:auto; font-family:var(--font-mono); font-size:13px; color:var(--blue); opacity:0.8;}

.tabs{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 30px;display:flex;gap:30px;position:sticky;top:65px;z-index:99}
.tab{padding:15px 0;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:0.3s;}
.tab.active{color:var(--text);border-bottom-color:var(--red);}

.quote-box { background: linear-gradient(rgba(0,0,0,0), var(--bg2)); padding: 40px 20px; text-align: center; border-bottom: 1px solid var(--border); }
#quote-text { font-size: 18px; font-style: italic; font-weight: 300; color: var(--text2); max-width: 700px; margin: 0 auto; line-height: 1.6; }
#quote-auth { font-size: 11px; text-transform: uppercase; letter-spacing: 3px; color: var(--red); margin-top: 15px; font-weight: 700; }

.main{padding:30px;max-width:1200px;margin:0 auto}
.section{display:none}.section.active{display:block}

.timer-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.mcard{background:var(--panel);border:1px solid var(--border);padding:25px;transition:0.4s; position: relative; overflow: hidden;}
.mcard.active-flair { animation: flairPulse 4s infinite ease-in-out; border-color: rgba(0, 255, 163, 0.3); }

.timer-disp{font-family:var(--font-mono);font-size:42px;color:var(--green);margin:20px 0;text-align:center;text-shadow: 0 0 15px rgba(0, 255, 163, 0.3);}

.filter-bar{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; padding-bottom:15px; border-bottom:1px solid var(--border);}
.f-btn{padding:6px 12px; font-size:10px; font-family:var(--font-mono); background:var(--bg3); border:1px solid var(--border); color:var(--text2); cursor:pointer; text-transform:uppercase;}
.f-btn.active{border-color:var(--blue); color:var(--blue); background:rgba(0,210,255,0.05);}

.bar-container { width: 100%; background: var(--bg); height: 8px; border-radius: 4px; margin-top: 8px; overflow: hidden; border: 1px solid var(--border); }
.bar-fill { height: 100%; transition: width 1s ease-out; box-shadow: 0 0 10px rgba(0, 255, 163, 0.2); }

.dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:40px}
.stat-card{background:var(--bg2);border:1px solid var(--border);padding:20px; position: relative;}
.stat-lbl{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--text3);margin-bottom:10px;}
.stat-val{font-size:32px;font-weight:700;font-family:var(--font-head);}

.leader-panel { max-width: 900px; margin: 0 auto; }
.rank-tag { font-family: var(--font-head); font-weight: 900; font-size: 18px; width: 50px; text-align: center; }
.gold { color: var(--yellow); } .silver { color: #C0C0C0; } .bronze { color: #CD7F32; }

.btn{padding:12px;border:none;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:1px;transition: 0.2s; font-family: var(--font-head);}
.btn-start{background:var(--text);color:var(--bg);width:100%;}
.btn-stop{background:var(--red);color:#fff;width:100%;}

textarea{width:100%;background:var(--bg);border:1px solid var(--border);padding:10px;color:var(--text);margin-bottom:10px;resize:none;}

.fw-table{width:100%;border-collapse:collapse;margin-top:20px}
.fw-table th{text-align:left;color:var(--text3);font-size:11px;text-transform:uppercase;padding:15px;border-bottom:1px solid var(--border);}
.fw-table td{padding:15px;border-bottom:1px solid rgba(255,255,255,0.03);font-size:14px;color:var(--text2);}

@media(max-width:800px){ .dash-grid{grid-template-columns:1fr 1fr} }
</style>
</head>
<body>

<div class="load-overlay" id="loadOverlay">
    <div class="fw-logo" style="width:180px;height:70px;font-size:32px;">RAHMAN</div>
    <div style="font-family:var(--font-mono);margin-top:20px;color:var(--text3);letter-spacing:5px;">INITIALIZING_...</div>
</div>

<div class="hdr">
    <div class="fw-logo">RAHMAN</div>
    <div class="hdr-title">Study Tracker</div>
    <div class="live-clock" id="liveClock">00:00:00</div>
</div>

<div class="quote-box">
    <div id="quote-text">"Success is not final, failure is not fatal: it is the courage to continue that counts."</div>
    <div id="quote-auth">— Winston Churchill</div>
</div>

<div class="tabs">
    <div class="tab active" onclick="switchTab('timer', this)">Session</div>
    <div class="tab" onclick="switchTab('logs', this)">Records</div>
    <div class="tab" onclick="switchTab('dashboard', this)">Intelligence</div>
    <div class="tab" onclick="switchTab('weekly', this)">Weekly</div>
</div>

<div class="main">
    <div class="section active" id="sec-timer">
        <div class="timer-grid" id="timerGrid"></div>
    </div>
    
    <div class="section" id="sec-logs">
        <div style="background:var(--panel); padding:30px; border:1px solid var(--border);">
            <div class="filter-bar" id="logFilters">
                <button class="f-btn active" onclick="setLogFilter('ALL', this)">ALL_LOGS</button>
            </div>
            <table class="fw-table">
                <thead><tr><th>Date</th><th>Member</th><th>Duration</th><th>Topic</th></tr></thead>
                <tbody id="logsBody"></tbody>
            </table>
        </div>
    </div>

    <div class="section" id="sec-dashboard">
        <div class="dash-grid">
            <div class="stat-card"><div class="stat-lbl">Group Total</div><div class="stat-val" id="stat-total">0.00</div></div>
            <div class="stat-card"><div class="stat-lbl">Today's Focus</div><div class="stat-val" id="stat-today">0.00</div></div>
            <div class="stat-card"><div class="stat-lbl">Active Now</div><div class="stat-val" style="color:var(--red)" id="stat-active">0</div></div>
            <div class="stat-card"><div class="stat-lbl">Group Goal</div><div class="stat-val" style="color:var(--green)">5.00</div></div>
        </div>
        <div class="leader-panel">
            <table class="fw-table" style="background:var(--panel); border:1px solid var(--border);">
                <tbody id="leaderBody"></tbody>
            </table>
        </div>
    </div>

    <div class="section" id="sec-weekly">
        <div style="background:var(--panel); border:1px solid var(--border); overflow-x:auto;">
            <table class="fw-table" style="text-align:center;">
                <thead id="weeklyHead"></thead>
                <tbody id="weeklyBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyCP3cpWaAQ1i8C93a4F_5qsnk84KZ6CZtU",
    authDomain: "rahmansstudytracker.firebaseapp.com",
    databaseURL: "https://rahmansstudytracker-default-rtdb.firebaseio.com",
    projectId: "rahmansstudytracker",
    storageBucket: "rahmansstudytracker.firebasestorage.app",
    messagingSenderId: "456896961682",
    appId: "1:456896961682:web:ead674692696c88a625a4b"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const MEMBERS = ["Abdur Rahman", "Hannan", "Yasin Arafat", "Imtiaj Rahman", "Sabbir Rahman(Tahsin)", "Zidan Hasan", "Nadim"];
const M_COLORS = { "Abdur Rahman":"#00b4ff", "Hannan":"#00ff88", "Yasin Arafat":"#ffd600", "Imtiaj Rahman":"#bb86fc", "Sabbir Rahman(Tahsin)":"#ff3b3b", "Zidan Hasan":"#0070ff", "Nadim":"#ff9100" };
const SKEY = "fw_tracker_v3";
let ME = localStorage.getItem("fw_me");
let IS_ADMIN = localStorage.getItem("fw_role") === "admin";

let sessions = [], timers = {}, currentFilter = "ALL";

function elapsed(iso) {
    const ms = Date.now() - new Date(iso).getTime();
    const h = Math.floor(ms/3600000), m = Math.floor((ms%3600000)/60000), s = Math.floor((ms%60000)/1000);
    return `${h < 10 ? "0"+h : h}:${m < 10 ? "0"+m : m}:${s < 10 ? "0"+s : s}`;
}

function initSync() {
    db.ref(SKEY).on('value', snap => {
        const data = snap.val() || {};
        sessions = data.sessions || [];
        timers = data.timers || {};
        reRender();
        document.getElementById("loadOverlay").style.display = "none";
    });
}

function setLogFilter(name, btn) {
    currentFilter = name;
    document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    reRender();
}

function reRender() {
    // 1. Timer Grid
    const grid = document.getElementById("timerGrid");
    grid.innerHTML = MEMBERS.map(m => {
        const isRun = !!timers[m];
        return `
        <div class="mcard ${isRun ? 'active-flair' : ''}" style="border-left: 4px solid ${M_COLORS[m]}">
            <div style="display:flex; justify-content:space-between;">
                <div class="m_bold" style="color:${M_COLORS[m]}">${m.toUpperCase()}</div>
                <div style="font-size:9px; color:var(--text3)">${isRun?'ACTIVE':'IDLE'}</div>
            </div>
            <div class="timer-disp" id="tdisp-${m}">${isRun?elapsed(timers[m].startISO):'00:00:00'}</div>
            ${!IS_ADMIN && m===ME ? `<textarea id="tp-${m}" placeholder="Today's focus...">${timers[m]?.topics || ''}</textarea>
            <button class="btn ${isRun?'btn-stop':'btn-start'}" onclick="${isRun?'stopTimer()':'startTimer()'}">${isRun?'STOP':'START'}</button>` : ''}
        </div>`;
    }).join("");

    // 2. Logs
    let filtered = [...sessions];
    if(currentFilter !== "ALL") filtered = filtered.filter(s => s.member === currentFilter);
    document.getElementById("logsBody").innerHTML = filtered.reverse().slice(0,30).map(s => `
        <tr><td>${s.date}</td><td class="m_bold" style="color:${M_COLORS[s.member]}">${s.member}</td><td>${s.hours.toFixed(2)}h</td><td>${s.topics||'—'}</td></tr>
    `).join("");

    // 3. Leaderboard
    const totals = MEMBERS.map(m => ({ name: m, hrs: sessions.filter(s => s.member === m).reduce((a,b)=>a+b.hours,0) }));
    const maxHrs = Math.max(...totals.map(t => t.hrs), 1);
    const sorted = totals.sort((a,b) => b.hrs - a.hrs);
    document.getElementById("leaderBody").innerHTML = sorted.map((l, i) => {
        const pct = (l.hrs / maxHrs) * 100;
        const rank = i+1;
        const suffix = rank === 1 ? 'st' : (rank === 2 ? 'nd' : (rank === 3 ? 'rd' : 'th'));
        return `<tr><td class="rank-tag ${i<3?['gold','silver','bronze'][i]:''}">${rank}${suffix}</td>
        <td style="width:200px;"><div class="m_bold" style="color:${M_COLORS[l.name]}">${l.name}</div></td>
        <td><div style="font-family:var(--font-mono); font-size:12px; color:var(--green);">${l.hrs.toFixed(2)} HRS</div>
        <div class="bar-container"><div class="bar-fill" style="width:${pct}%; background:${M_COLORS[l.name]}"></div></div></td></tr>`;
    }).join("");

    document.getElementById("stat-total").textContent = sessions.reduce((a,b)=>a+b.hours,0).toFixed(2);
    document.getElementById("stat-active").textContent = Object.keys(timers).length;

    // 4. Weekly
    const curr = new Date();
    const first = curr.getDate() - curr.getDay() + (curr.getDay() === 0 ? -6 : 1);
    const week = [];
    for(let i=0; i<7; i++) week.push(new Date(new Date().setDate(first + i)).toISOString().slice(0,10));
    document.getElementById("weeklyHead").innerHTML = `<tr><th>Member</th>${week.map(d => `<th>${d.slice(5)}</th>`).join("")}</tr>`;
    document.getElementById("weeklyBody").innerHTML = MEMBERS.map(m => {
        const cells = week.map(d => {
            const h = sessions.filter(s => s.member === m && s.date === d).reduce((a,b)=>a+b.hours,0);
            return `<td style="color:${h>0?M_COLORS[m]:'var(--text3)'}">${h>0?h.toFixed(1):'—'}</td>`;
        }).join("");
        return `<tr><td class="m_bold" style="text-align:left; color:${M_COLORS[m]}">${m}</td>${cells}</tr>`;
    }).join("");
}

function switchTab(id, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('sec-'+id).classList.add('active');
}

async function startTimer() {
    if(IS_ADMIN) return;
    timers[ME] = { startISO: new Date().toISOString(), topics: document.getElementById("tp-"+ME).value };
    await db.ref(SKEY).set({ sessions, timers });
}

async function stopTimer() {
    if(IS_ADMIN) return;
    const t = timers[ME];
    const end = new Date().toISOString();
    const hrs = (new Date(end) - new Date(t.startISO)) / 3600000;
    if(hrs > 0.01) sessions.push({ member: ME, date: end.slice(0,10), startISO: t.startISO, hours: hrs, topics: document.getElementById("tp-"+ME).value });
    delete timers[ME];
    await db.ref(SKEY).set({ sessions, timers });
}

window.onload = () => {
    if(!ME && !IS_ADMIN) {
        document.getElementById("loadOverlay").innerHTML = `
        <div class="fw-logo">AUTH</div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:20px; width:90%; max-width:400px;">
            ${MEMBERS.map(m => `<button class="btn btn-start" onclick="localStorage.setItem('fw_me','${m}');localStorage.setItem('fw_role','user');location.reload()">${m}</button>`).join("")}
            <button class="btn btn-stop" style="grid-column: span 2; background:var(--blue);" onclick="localStorage.setItem('fw_me','Admin');localStorage.setItem('fw_role','admin');location.reload()">ADMINISTRATOR (VIEW ONLY)</button>
        </div>`;
    } else {
        const fContainer = document.getElementById("logFilters");
        MEMBERS.forEach(m => {
            const btn = document.createElement("button");
            btn.className = "f-btn";
            btn.textContent = m.split(" ")[0];
            btn.onclick = (e) => setLogFilter(m, e.target);
            fContainer.appendChild(btn);
        });
        initSync();
        setInterval(() => {
            document.getElementById("liveClock").textContent = new Date().toLocaleTimeString();
            MEMBERS.forEach(m => { if(timers[m]) document.getElementById("tdisp-"+m).textContent = elapsed(timers[m].startISO); });
        }, 1000);
    }
};
</script>
</body>
</html>
